<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全心日記</title>
  <meta name="description" content="一天一篇的日記 App。日記與圖片只存在你的手機與你自己的 Google 雲端硬碟。">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <img src="favicon.png" alt="">
    <span class="title">全心日記</span>
  </header>
  <main>
    <div class="card">
      <div class="row">
        <img src="icon_256.png" alt="App 圖示" width="96" height="96" style="border-radius: 22px">
        <div class="grow">
          <h1 style="margin: 0; font-size: 22px">全心日記</h1>
          <p style="margin: 6px 0 0">一天一篇的日記：可以調整字體大小、粗體、顏色，加上圖片，
            再用行事曆、篩選與搜尋找回過去的日記。</p>
        </div>
      </div>
    </div>
    <div class="card">
      <h2 style="margin-top: 0; font-size: 17px">你的日記只在你手上</h2>
      <ul>
        <li>日記與圖片只存在你的手機，或你自己的 Google 雲端硬碟（開啟雲端功能時）。</li>
        <li>匯出檔整份加密，只能用匯出時的 Google 帳號匯入；我們拿不到金鑰。</li>
        <li>沒有廣告，也沒有任何分析工具。</li>
      </ul>
    </div>
    <div class="card">
      <h2 style="margin-top: 0; font-size: 17px">條款與政策</h2>
      <div class="links">
        <a class="btn" href="legal.html?doc=terms">使用者條款</a>
        <a class="btn" href="legal.html?doc=privacy">隱私權政策</a>
      </div>
    </div>
    <div class="card">
      <h2 style="margin-top: 0; font-size: 17px">下載</h2>
      <p class="muted" style="margin: 0">目前尚未在 Google Play 上架。</p>
    </div>
  </main>
  <footer>阿舍老師 · <a href="mailto:tutorarthurouat@outlook.com">tutorarthurouat@outlook.com</a></footer>
</body>
</html>
